name: Content policy
on: [push, pull_request]
jobs:
  content-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/repository -p 'test_*.py'
      - run: python tools/check_repository.py
